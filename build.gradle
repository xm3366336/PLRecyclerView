buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
    }
}

ext {
    compileSdkVersion = 37
    minSdkVersion = 24
    targetSdkVersion = 37
    versionCode = 2611081
    versionName = "2.3.0"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
